{% extends "base.html" %}

{% block title %}Thêm thành viên mới{% endblock %}

{% block content %}
<div class="page-header">
    <h1><i class="fas fa-user-plus"></i> Thêm thành viên mới</h1>
</div>

<div class="form-container">
    <form method="POST" class="form">
        <div class="form-group">
            <label for="ma_thanh_vien">Mã thành viên *</label>
            <input type="text" id="ma_thanh_vien" name="ma_thanh_vien" required placeholder="VD: TV001">
        </div>

        <div class="form-group">
            <label for="ho_ten">Họ tên *</label>
            <input type="text" id="ho_ten" name="ho_ten" required placeholder="Nhập họ tên">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="sdt">Số điện thoại</label>
                <input type="tel" id="sdt" name="sdt" placeholder="Nhập số điện thoại">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Nhập email">
            </div>
        </div>

        <div class="form-group">
            <label for="ghi_chu">Ghi chú</label>
            <textarea id="ghi_chu" name="ghi_chu" rows="4" placeholder="Nhập ghi chú (tùy chọn)"></textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save"></i> Thêm thành viên
            </button>
            <a href="{{ url_for('main.danh_sach_thanh_vien') }}" class="btn btn-secondary">
                <i class="fas fa-times"></i> Hủy
            </a>
        </div>
    </form>
</div>
{% endblock %}
