{% extends "base.html" %}

{% block title %}Thêm nhân viên mới{% endblock %}

{% block content %}
<div class="page-header">
    <h1><i class="fas fa-user-plus"></i> Thêm nhân viên mới</h1>
</div>

<div class="form-container">
    <form method="POST" class="form">
        <div class="form-group">
            <label for="ma_nv">Mã nhân viên *</label>
            <input type="text" id="ma_nv" name="ma_nv" required placeholder="VD: NV001">
        </div>

        <div class="form-group">
            <label for="ho_ten">Họ tên *</label>
            <input type="text" id="ho_ten" name="ho_ten" required placeholder="Nhập họ tên">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="sdt">Số điện thoại</label>
                <input type="tel" id="sdt" name="sdt" placeholder="Nhập số điện thoại">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Nhập email">
            </div>
        </div>

        <div class="form-group">
            <label for="dia_chi">Địa chỉ</label>
            <input type="text" id="dia_chi" name="dia_chi" placeholder="Nhập địa chỉ">
        </div>

        <div class="form-group">
            <label for="ma_chi_nhanh">Chi nhánh *</label>
            <select id="ma_chi_nhanh" name="ma_chi_nhanh" required>
                <option value="">-- Chọn chi nhánh --</option>
                {% for cn in chi_nhanh %}
                <option value="{{ cn.ma_chi_nhanh }}">{{ cn.ten_chi_nhanh }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save"></i> Thêm nhân viên
            </button>
            <a href="{{ url_for('main.danh_sach_nhan_vien') }}" class="btn btn-secondary">
                <i class="fas fa-times"></i> Hủy
            </a>
        </div>
    </form>
</div>
{% endblock %}
